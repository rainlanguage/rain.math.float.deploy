name: Manual sol artifacts
# The on-chain deploy, human-dispatched, run BEFORE tagging a release. Deploy
# the log-tables data contract once per chain, then the DecimalFloat concrete
# (its constructor reads the log tables at the Zoltu address). Never broadcasts
# on merge.
#
# The `suite` input below is passed as DEPLOYMENT_SUITE. `script/Deploy.sol`
# holds no switch on it — it is a declaration plus `RainDeployBroadcast`, and
# upstream's `RainDeployBroadcast.run()` resolves the value through
# `suiteByName` against the keys `src/abstract/DecimalFloatDeploySuites.sol`
# declares. A mistyped key reports the valid ones from there.
#
# Those keys are hand-listed as `options` because a workflow input cannot read
# them out of Solidity. They are the one place in this repo that restates the
# declaration, so a suite added there needs a line added here; an unlisted suite
# simply cannot be dispatched, which fails visibly rather than deploying the
# wrong thing.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "The suite to deploy"
        required: true
        type: choice
        options:
          - log-tables
          - decimal-float
          # Frozen releases: what a newly supported network needs, so the
          # addresses every consumer pins land there (the bare keys above
          # deploy current source, which has moved since these were cut).
          - log-tables@0_1_1
          - log-tables@0_1_2
          - decimal-float@0_1_1
          - decimal-float@0_1_2
jobs:
  deploy:
    uses: rainlanguage/rainix/.github/workflows/rainix-manual-sol-artifacts.yaml@main
    with:
      suite: ${{ inputs.suite }}
    secrets: inherit
