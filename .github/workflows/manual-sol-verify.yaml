name: Manual sol verify
# Explorer source verification for a contract ALREADY on chain, run by hand.
#
# `Manual sol artifacts` submits source only for what its own run broadcast, so
# a deploy that lands and then loses the race with an explorer's indexer cannot
# be repaired by re-dispatching it: the Zoltu deploy is deterministic and
# therefore idempotent, the rerun broadcasts nothing, and `--verify` has nothing
# to submit. That is what happened to `DecimalFloat` on 2026-09-28 — deployed to
# all nine networks, then `Not all (0 / 1) contracts were verified!` after forty
# `Pending in queue` polls.
#
# Never broadcasts and takes no deploy key.
#
# The explorers are not named here. `rainix-manual-sol-verify` reads them from
# this repo's own `[etherscan]`, the same set `testSupportedNetworksAreFullyConfigured`
# holds to `LibRainDeploy.supportedNetworks()`.
on:
  workflow_dispatch:
    inputs:
      contract:
        description: "Contract to verify"
        required: true
        type: choice
        options:
          - DecimalFloat
          # Only `DecimalFloat` has source to verify. The other deployed artifact
          # is the log tables, which is a data contract: `LibDataContract` creation
          # code wrapping table BYTES, with no Solidity source an explorer could
          # match it against.
jobs:
  # The address is READ from the committed snapshot, never typed into this file.
  # It moves whenever the creation code does — it moved to 0xEc632ea4 this week
  # — so a literal here would go stale silently and submit source against
  # whatever used to be at it. A workflow input cannot read the snapshot, which
  # is why this is a job rather than a `default:`.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      contract: ${{ steps.pins.outputs.contract }}
      address: ${{ steps.pins.outputs.address }}
    steps:
      - uses: rainlanguage/rainix/.github/actions/checkout@main
      - id: pins
        env:
          CONTRACT: ${{ inputs.contract }}
        run: |
          set -euo pipefail

          # `|| true` because under `set -e` with `pipefail` a grep that matches
          # nothing exits 1 and kills the step, so the check below would never
          # run and the operator would get a bare exit code instead of being told
          # the snapshot had no address in it.
          snapshot="src/generated/candidate/$CONTRACT.sol"
          address="$(grep -oE 'DEPLOYED_ADDRESS = address\(0x[0-9a-fA-F]{40}\)' "$snapshot" \
            | grep -oE '0x[0-9a-fA-F]{40}' || true)"

          if [ -z "$address" ]
          then
            echo "::error::no DEPLOYED_ADDRESS in $snapshot"
            exit 1
          fi

          echo "verifying $CONTRACT at $address"
          {
            echo "contract=src/concrete/$CONTRACT.sol:$CONTRACT"
            echo "address=$address"
          } >> "$GITHUB_OUTPUT"
  verify:
    needs: resolve
    uses: rainlanguage/rainix/.github/workflows/rainix-manual-sol-verify.yaml@main
    with:
      contract: ${{ needs.resolve.outputs.contract }}
      address: ${{ needs.resolve.outputs.address }}
    secrets: inherit
